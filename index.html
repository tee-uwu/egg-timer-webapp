<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Egg Timer <3</title>
    <style>
        /* General Setup and Pixel Font/Style */
        @font-face {
            font-family: 'Pixelify';
            src: local('Courier New'), monospace;
        }

        :root {
            --color-window-bg: #ffe4a8; /* Pale Yellow/Beige */
            --color-window-border: #f2e27e; /* Yellow */
            --color-title-bar: #f9d868; /* Slightly darker Yellow */
            --color-text: #a84c3e; /* Dark Orange/Brown */
            --color-button-bg: #f9c7a2; /* Light Peach */
            --color-button-border: #a84c3e; /* Dark Orange/Brown */
            --color-button-hover: #ffad82;
            --color-timer-bg: #3d2b1f; /* Very dark brown for countdown numbers */
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f7f1e3; /* Light background for the overall page */
            font-family: 'Pixelify', 'Courier New', monospace;
            color: var(--color-text);
            padding: 20px;
        }

        /* --- Pixelated Window Frame CSS --- */
        #app-window {
            width: 90%;
            max-width: 400px;
            /* 3-pixel border simulation using box-shadow */
            border: 2px solid var(--color-window-border);
            box-shadow:
                3px 3px 0 0 var(--color-title-bar),
                6px 6px 0 0 var(--color-window-border),
                9px 9px 0 0 var(--color-text); /* Deep shadow for 3D effect */
            background-color: var(--color-window-bg);
            border-radius: 0; /* Pixel art usually has sharp corners */
            overflow: hidden;
            position: relative;
        }

        .title-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 12px;
            background-color: var(--color-title-bar);
            border-bottom: 2px solid var(--color-text);
            font-size: 1.25rem;
            text-shadow: 1px 1px 0 #fff; /* White outline for pixel text */
            user-select: none;
            cursor: default;
        }

        .window-controls > div {
            width: 16px;
            height: 16px;
            background-color: var(--color-button-bg);
            border: 2px solid var(--color-text);
            display: inline-block;
            margin-left: 4px;
            cursor: pointer;
            box-shadow: 1px 1px 0 0 var(--color-text);
            position: relative;
        }

        .window-controls .close-btn::after,
        .window-controls .minimize-btn::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: block;
        }

        .window-controls .minimize-btn::after {
            width: 60%;
            height: 2px;
            background-color: var(--color-text);
            top: 70%;
        }
        .window-controls .close-btn::after {
            width: 100%;
            height: 100%;
            background: linear-gradient(to top left, transparent 47%, var(--color-text) 49%, var(--color-text) 51%, transparent 53%),
                        linear-gradient(to top right, transparent 47%, var(--color-text) 49%, var(--color-text) 51%, transparent 53%);
        }

        /* Simulating the cloud background pattern */
        .window-content {
            padding: 20px;
            min-height: 400px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;

            /* Custom Background Pattern (Clouds) */
            background-image:
                radial-gradient(circle at 10% 20%, rgba(255, 255, 255, 0.4) 1px, transparent 1px),
                radial-gradient(circle at 90% 80%, rgba(255, 255, 255, 0.5) 1px, transparent 1px),
                radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 0.6) 1px, transparent 1px);
            background-size: 40px 40px;
        }

        /* --- Pixelated Button Style --- */
        .pixel-button {
            background-color: var(--color-button-bg);
            border: none;
            padding: 10px 20px;
            font-size: 1.25rem;
            color: var(--color-button-border);
            text-transform: uppercase;
            cursor: pointer;

            /* Pixelated border effect */
            border-bottom: 3px solid var(--color-button-border);
            border-right: 3px solid var(--color-button-border);
            border-top: 1px solid white;
            border-left: 1px solid white;

            margin: 10px;
            font-family: inherit;
        }

        .pixel-button:active {
            transform: translate(2px, 2px);
            border-bottom: 1px solid var(--color-button-border);
            border-right: 1px solid var(--color-button-border);
            border-top: 3px solid white;
            border-left: 3px solid white;
        }

        .message {
            font-size: 1.5rem;
            margin-bottom: 30px;
            line-height: 1.4;
            text-shadow: 1px 1px 0 #fff;
        }

        /* --- Selection Screen Grid --- */
        .egg-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 20px;
            width: 100%;
        }

        .egg-option {
            cursor: pointer;
            padding: 10px;
            background: rgba(255, 255, 255, 0.7);
            border: 2px solid var(--color-text);
            box-shadow: 2px 2px 0 0 var(--color-text);
            transition: all 0.05s linear;
        }

        .egg-option:hover {
            transform: translate(-1px, -1px);
            box-shadow: 3px 3px 0 0 var(--color-text);
        }

        .egg-option:active {
            transform: translate(1px, 1px);
            box-shadow: 1px 1px 0 0 var(--color-text);
        }
        
        /* NEW: Styles for the image icon */
        .egg-icon-img {
            width: 64px; /* Adjust size for pixel look */
            height: 64px;
            image-rendering: pixelated; /* Essential for pixel art if using a large image */
            display: block;
            margin: 0 auto 5px auto;
            border: 2px solid var(--color-text); /* Add a border for a distinct look */
        }
        /* END NEW */

        .egg-option .visual {
            font-size: 3rem;
            display: block;
            margin-bottom: 5px;
            line-height: 1;
        }

        .egg-option .label {
            font-size: 1rem;
            font-weight: bold;
            text-shadow: 0.5px 0.5px 0 #fff;
        }

        /* --- Timer Screen Display --- */
        .timer-display {
            font-size: 5rem; /* Large pixel numbers */
            font-weight: bold;
            margin: 40px 0 20px 0;
            padding: 10px 20px;
            color: var(--color-window-bg);
            background-color: var(--color-timer-bg);
            border: 4px solid var(--color-text);
            box-shadow: 4px 4px 0 0 var(--color-text);
        }

        .egg-in-progress {
            /* Using the new image class for the in-progress egg */
            margin-bottom: 20px;
        }
        
        .egg-in-progress .egg-icon-img {
            width: 128px; /* Larger size for the countdown screen - UPDATED! */
            height: 128px; /* Larger size for the countdown screen - UPDATED! */
        }

        /* The finished egg image simulation */
        .finished-egg-visual {
            /* Using the new image class for the finished egg */
            margin: 20px 0;
            line-height: 1;
        }
        
        .finished-egg-visual .egg-icon-img {
            width: 128px; /* Even larger for the finished screen */
            height: 128px;
        }
    </style>
</head>
<body>

    <div id="app-window">
        <div class="title-bar">
            <span>Egg Timer &lt;3</span>
            <div class="window-controls">
                <div class="minimize-btn" title="Minimize"></div>
                <div class="maximize-btn" title="Maximize"></div>
                <div class="close-btn" title="Close" onclick="resetApp()"></div>
            </div>
        </div>
        <div id="window-content" class="window-content">
            </div>
    </div>

    <script>
        // State Management
        let currentState = 'start';
        let timerInterval = null;
        let timeLeft = 0;
        let selectedEgg = null;
        const SNOOZE_TIME = 60; // 1 minute snooze

        // Egg Configuration (Time in seconds) - UPDATED TO USE ICON URLS
        const EGG_OPTIONS = [
            // **NOTE:** You need to replace the placeholders below with actual paths to your pixel art image files (e.g., in an 'images' folder).
            { id: 'soft', name: "Soft Boiled", time: 300, iconUrl: "images/icon-soft.png", description: "Runny yolk, set white" }, // 5 min
            { id: 'medium', name: "Medium Boiled", time: 480, iconUrl: "images/icon-medium.png", description: "Jammy yolk, firm white" }, // 8 min
            { id: 'hard', name: "Hard Boiled", time: 600, iconUrl: "images/icon-hard.png", description: "Fully set, firm" }, // 10 min
            { id: 'scrambled', name: "Scrambled", time: 120, iconUrl: "images/icon-scrambled.png", description: "Quick & easy" } // 2 min
        ];
        
        // Define generic icons for timer/finished states
        const GENERIC_IN_PROGRESS_ICON = "images/icon-cooking.png";
        const GENERIC_FINISHED_ICON = "images/icon-finished.png";

        const contentDiv = document.getElementById('window-content');

        // --- Screen Rendering Functions ---

        function renderStartScreen() {
            currentState = 'start';
            contentDiv.innerHTML = `
                <div class="message">
                    Let's time<br>your egg!
                </div>
                <button class="pixel-button" onclick="renderSelectionScreen()">Start</button>
            `;
        }

        function renderSelectionScreen() {
            currentState = 'selection';
            contentDiv.innerHTML = `
                <div class="message" style="margin-bottom: 10px;">
                    What are you making today?
                </div>
                <div class="egg-grid">
                    ${EGG_OPTIONS.map(egg => `
                        <div class="egg-option" onclick="startCountdown(${egg.time}, '${egg.name}')" title="${egg.description}">
                            <img src="${egg.iconUrl}" alt="${egg.name} icon" class="egg-icon-img visual">
                            <span class="label">${egg.name}</span>
                        </div>
                    `).join('')}
                </div>
            `;
        }

        function renderTimerScreen(time) {
            currentState = 'countdown';
            contentDiv.innerHTML = `
                <div class="message">
                    Your ${selectedEgg || 'egg'} is ready in..
                </div>
                <div class="egg-in-progress">
                    <img src="${GENERIC_IN_PROGRESS_ICON}" alt="Egg cooking icon" class="egg-icon-img">
                </div>
                <div id="timer-display" class="timer-display">
                    00:00
                </div>
            `;
            updateTimerDisplay(time);
        }

        function renderFinishedScreen() {
            currentState = 'finished';
            contentDiv.innerHTML = `
                <div class="message">
                    Your egg is done!
                </div>
                <div class="finished-egg-visual">
                    <img src="${GENERIC_FINISHED_ICON}" alt="Egg finished icon" class="egg-icon-img">
                </div>
                <div style="display: flex; gap: 10px;">
                    <button class="pixel-button" onclick="snoozeTimer()">Snooze</button>
                    <button class="pixel-button" onclick="resetApp()">Close</button>
                </div>
            `;
            // new Audio('https://example.com/ding.mp3').play();
        }

        // --- Timer Logic ---

        function formatTime(totalSeconds) {
            const minutes = String(Math.floor(totalSeconds / 60)).padStart(2, '0');
            const seconds = String(totalSeconds % 60).padStart(2, '0');
            return `${minutes}:${seconds}`;
        }

        function updateTimerDisplay(time) {
            const display = document.getElementById('timer-display');
            if (display) {
                display.textContent = formatTime(time);
            }
        }

        function startCountdown(duration, name) {
            selectedEgg = name;
            timeLeft = duration;

            // Clear any existing interval
            if (timerInterval) clearInterval(timerInterval);

            renderTimerScreen(timeLeft);

            timerInterval = setInterval(() => {
                if (timeLeft > 0) {
                    timeLeft--;
                    updateTimerDisplay(timeLeft);
                } else {
                    clearInterval(timerInterval);
                    timerInterval = null;
                    renderFinishedScreen();
                }
            }, 1000);
        }

        function snoozeTimer() {
            startCountdown(SNOOZE_TIME, 'snooze alarm');
        }

        function resetApp() {
            if (timerInterval) clearInterval(timerInterval);
            timerInterval = null;
            timeLeft = 0;
            selectedEgg = null;
            renderStartScreen();
        }

        // Initialize the app on page load
        window.onload = function() {
            resetApp();
        };

    </script>
</body>
</html>
