<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Egg Timer &lt;3</title>

  <style>
    @font-face {
      font-family: "Pixelify";
      src: local("Courier New"), monospace;
    }

    :root{
      --color-window-bg:#ffe4a8;
      --color-window-border:#f2e27e;
      --color-title-bar:#f9d868;
      --color-text:#a84c3e;
      --color-button-bg:#f9c7a2;
      --color-button-border:#a84c3e;
      --color-timer-bg:#3d2b1f;
    }

    body{
      display:flex;
      justify-content:center;
      align-items:center;
      min-height:100vh;
      margin:0;
      background:#f7f1e3;
      font-family:"Pixelify","Courier New",monospace;
      color:var(--color-text);
      padding:20px;
    }

    #app-window{
      width:90%;
      max-width:420px;
      border:2px solid var(--color-window-border);
      box-shadow:
        3px 3px 0 0 var(--color-title-bar),
        6px 6px 0 0 var(--color-window-border),
        9px 9px 0 0 var(--color-text);
      background:var(--color-window-bg);
      overflow:hidden;
      position:relative;
    }

    .title-bar{
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding:8px 12px;
      background:var(--color-title-bar);
      border-bottom:2px solid var(--color-text);
      font-size:1.25rem;
      text-shadow:1px 1px 0 #fff;
      user-select:none;
    }

    .window-controls > div{
      width:16px;height:16px;
      background:var(--color-button-bg);
      border:2px solid var(--color-text);
      display:inline-block;
      margin-left:4px;
      cursor:pointer;
      box-shadow:1px 1px 0 0 var(--color-text);
      position:relative;
    }

    .window-controls .close-btn::after,
    .window-controls .minimize-btn::after{
      content:"";
      position:absolute;
      top:50%;left:50%;
      transform:translate(-50%,-50%);
      display:block;
    }

    .window-controls .minimize-btn::after{
      width:60%;
      height:2px;
      background:var(--color-text);
      top:70%;
    }

    .window-controls .close-btn::after{
      width:100%;
      height:100%;
      background:
        linear-gradient(to top left, transparent 47%, var(--color-text) 49%, var(--color-text) 51%, transparent 53%),
        linear-gradient(to top right, transparent 47%, var(--color-text) 49%, var(--color-text) 51%, transparent 53%);
    }

    .window-content{
      padding:20px;
      min-height:420px;
      display:flex;
      flex-direction:column;
      justify-content:center;
      align-items:center;
      text-align:center;

      background-image:
        radial-gradient(circle at 10% 20%, rgba(255,255,255,.4) 1px, transparent 1px),
        radial-gradient(circle at 90% 80%, rgba(255,255,255,.5) 1px, transparent 1px),
        radial-gradient(circle at 50% 50%, rgba(255,255,255,.6) 1px, transparent 1px);
      background-size:40px 40px;
    }

    .pixel-button{
      background:var(--color-button-bg);
      border:none;
      padding:10px 20px;
      font-size:1.25rem;
      color:var(--color-button-border);
      text-transform:uppercase;
      cursor:pointer;

      border-bottom:3px solid var(--color-button-border);
      border-right:3px solid var(--color-button-border);
      border-top:1px solid #fff;
      border-left:1px solid #fff;

      margin:10px;
      font-family:inherit;
    }

    .pixel-button:active{
      transform:translate(2px,2px);
      border-bottom:1px solid var(--color-button-border);
      border-right:1px solid var(--color-button-border);
      border-top:3px solid #fff;
      border-left:3px solid #fff;
    }

    .message{
      font-size:1.5rem;
      margin-bottom:30px;
      line-height:1.4;
      text-shadow:1px 1px 0 #fff;
    }

    .egg-grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:20px;
      margin-top:20px;
      width:100%;
    }

    .egg-option{
      cursor:pointer;
      padding:10px;
      background:rgba(255,255,255,.7);
      border:2px solid var(--color-text);
      box-shadow:2px 2px 0 0 var(--color-text);
      transition:all .05s linear;
    }

    .egg-option:hover{
      transform:translate(-1px,-1px);
      box-shadow:3px 3px 0 0 var(--color-text);
    }

    .egg-option:active{
      transform:translate(1px,1px);
      box-shadow:1px 1px 0 0 var(--color-text);
    }

    .egg-icon-img{
      width:64px;height:64px;
      image-rendering:pixelated;
      display:block;
      margin:0 auto 6px auto;
      border:2px solid var(--color-text);
      background:#fff;
    }

    .egg-option .label{
      font-size:1rem;
      font-weight:bold;
      text-shadow:0.5px 0.5px 0 #fff;
    }

    .timer-display{
      font-size:5rem;
      font-weight:bold;
      margin:40px 0 20px;
      padding:10px 20px;
      color:var(--color-window-bg);
      background:var(--color-timer-bg);
      border:4px solid var(--color-text);
      box-shadow:4px 4px 0 0 var(--color-text);
    }

    .egg-in-progress{
      margin-bottom:20px;
    }

    .egg-in-progress .egg-icon-img,
    .finished-egg-visual .egg-icon-img{
      width:128px;height:128px;
    }

    @media (max-width: 420px){
      .timer-display{ font-size:4rem; }
      .egg-grid{ gap:14px; }
    }
  </style>
</head>

<body>
  <div id="app-window">
    <div class="title-bar">
      <span>Egg Timer &lt;3</span>
      <div class="window-controls">
        <div class="minimize-btn" title="Minimize"></div>
        <div class="maximize-btn" title="Maximize"></div>
        <div class="close-btn" title="Close" onclick="resetApp()"></div>
      </div>
    </div>

    <div id="window-content" class="window-content"></div>
  </div>

  <script>
    // --- State ---
    let currentState = "start";
    let timerInterval = null;
    let timeLeft = 0;
    let selectedEgg = null;
    const SNOOZE_TIME = 60; // seconds

    // ✅ IMPORTANT: icons are in the SAME folder as this HTML (no "images/" prefix)
    const EGG_OPTIONS = [
      { id: "soft",      name: "Soft Boiled",  time: 300, iconUrl: "icon-soft.png",      description: "Runny yolk, set white" },
      { id: "medium",    name: "Medium Boiled",time: 480, iconUrl: "icon-medium.png",    description: "Jammy yolk, firm white" },
      { id: "hard",      name: "Hard Boiled",  time: 600, iconUrl: "icon-hard.png",      description: "Fully set, firm" },
      { id: "scrambled", name: "Scrambled",    time: 120, iconUrl: "icon-scrambled.png", description: "Quick & easy" }
    ];

    // Generic icons (same folder)
    const GENERIC_IN_PROGRESS_ICON = "icon-cooking.png";
    const GENERIC_FINISHED_ICON    = "icon-finished.png";

    const contentDiv = document.getElementById("window-content");

    // --- Helpers ---
    function formatTime(totalSeconds){
      const minutes = String(Math.floor(totalSeconds / 60)).padStart(2, "0");
      const seconds = String(totalSeconds % 60).padStart(2, "0");
      return `${minutes}:${seconds}`;
    }

    function updateTimerDisplay(time){
      const display = document.getElementById("timer-display");
      if (display) display.textContent = formatTime(time);
    }

    // If an image path is wrong, show nothing instead of broken icon box
    function imgFallback(el){
      el.style.display = "none";
    }

    // --- Screens ---
    function renderStartScreen(){
      currentState = "start";
      contentDiv.innerHTML = `
        <div class="message">Let's time<br>your egg!</div>
        <button class="pixel-button" onclick="renderSelectionScreen()">Start</button>
      `;
    }

    function renderSelectionScreen(){
      currentState = "selection";
      contentDiv.innerHTML = `
        <div class="message" style="margin-bottom:10px;">What are you making today?</div>
        <div class="egg-grid">
          ${EGG_OPTIONS.map(egg => `
            <div class="egg-option"
                 onclick="startCountdown(${egg.time}, '${egg.name.replace(/'/g, "\\'")}')"
                 title="${egg.description}">
              <img src="${egg.iconUrl}" alt="${egg.name} icon" class="egg-icon-img" onerror="imgFallback(this)">
              <span class="label">${egg.name}</span>
            </div>
          `).join("")}
        </div>
      `;
    }

    function renderTimerScreen(time){
      currentState = "countdown";
      contentDiv.innerHTML = `
        <div class="message">Your ${selectedEgg || "egg"} is ready in..</div>
        <div class="egg-in-progress">
          <img src="${GENERIC_IN_PROGRESS_ICON}" alt="Egg cooking icon" class="egg-icon-img" onerror="imgFallback(this)">
        </div>
        <div id="timer-display" class="timer-display">00:00</div>
      `;
      updateTimerDisplay(time);
    }

    function renderFinishedScreen(){
      currentState = "finished";
      contentDiv.innerHTML = `
        <div class="message">Your egg is done!</div>
        <div class="finished-egg-visual">
          <img src="${GENERIC_FINISHED_ICON}" alt="Egg finished icon" class="egg-icon-img" onerror="imgFallback(this)">
        </div>
        <div style="display:flex;gap:10px;">
          <button class="pixel-button" onclick="snoozeTimer()">Snooze</button>
          <button class="pixel-button" onclick="resetApp()">Close</button>
        </div>
      `;
    }

    // --- Timer ---
    function startCountdown(duration, name){
      selectedEgg = name;
      timeLeft = duration;

      if (timerInterval) clearInterval(timerInterval);

      renderTimerScreen(timeLeft);

      timerInterval = setInterval(() => {
        if (timeLeft > 0){
          timeLeft--;
          updateTimerDisplay(timeLeft);
        } else {
          clearInterval(timerInterval);
          timerInterval = null;
          renderFinishedScreen();
        }
      }, 1000);
    }

    function snoozeTimer(){
      startCountdown(SNOOZE_TIME, "snooze alarm");
    }

    function resetApp(){
      if (timerInterval) clearInterval(timerInterval);
      timerInterval = null;
      timeLeft = 0;
      selectedEgg = null;
      renderStartScreen();
    }

    window.onload = resetApp;
  </script>
</body>
</html>
